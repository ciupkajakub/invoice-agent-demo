<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoice calculator</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <main>
    <h1>Invoice calculator</h1>

    <table id="lines">
      <thead>
        <tr><th>Item</th><th>Qty</th><th>Unit price (net)</th><th>Line net</th><th></th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <button type="button" id="add-line">Add line</button>

    <label class="field">
      VAT rate
      <select id="vat-rate"></select>
    </label>

    <label class="field">
      Issue date
      <input id="issue-date" type="date" required>
    </label>
    <label class="field">
      Payment term (days)
      <input id="payment-days" type="number" min="1" max="90" step="1" value="14" required>
    </label>

    <dl id="totals">
      <dt>Net</dt><dd data-total="net">–</dd>
      <dt>VAT</dt><dd data-total="vat">–</dd>
      <dt>Gross</dt><dd data-total="gross">–</dd>
      <dt>Due date</dt><dd data-due-date>–</dd>
    </dl>
    <p id="error" role="alert"></p>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
